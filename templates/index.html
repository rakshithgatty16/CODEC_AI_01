<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather AI Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="weather-icon">
        ☀️
    </div>

    <h1>Weather AI Predictor</h1>

    <p class="subtitle">
        Predict Temperature Using Machine Learning
    </p>

    <form action="/predict" method="POST">

        <input type="number"
               name="humidity"
               placeholder="Humidity (%)"
               required>

        <input type="number"
               name="windspeed"
               placeholder="Wind Speed (km/h)"
               required>

        <input type="number"
               name="pressure"
               placeholder="Pressure (hPa)"
               required>

        <button type="submit">
            Predict Temperature
        </button>

    </form>

    {% if prediction_text %}
    <div class="result">
        <h2>{{ prediction_text }}</h2>
    </div>
    {% endif %}

</div>

</body>
</html>
